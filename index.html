<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉伊卡哇 收藏圖鑑＆預購追蹤本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; }
    .tab-active {
      background-color: #ffffff;
      color: #db2777;
      box-shadow: 0 4px 14px rgba(219, 39, 119, 0.15);
      border-bottom: 2px solid #db2777;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-amber-50 min-h-screen text-slate-700 p-3 sm:p-8">

  <div class="max-w-5xl mx-auto">
    <!-- 頂部標題 -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 bg-white/80 border border-pink-200 px-3.5 py-1 rounded-full shadow-sm mb-2">
        <span>🌸</span>
        <span class="text-xs font-bold tracking-wider text-pink-600">CHIIKAWA COLLECTION</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800">
        ✨ 吉伊卡哇收藏圖鑑 ＆ 追蹤帳本 ✨
      </h1>
      <p class="text-xs sm:text-sm text-pink-400 mt-1 font-medium">貼上商品網址自動帶出官方圖 × 日幣自填最精準 ☁️</p>
    </header>

    <!-- 分頁切換 -->
    <div class="flex justify-center mb-6">
      <div class="bg-pink-100/70 p-1.5 rounded-2xl flex gap-2 border border-pink-200 shadow-inner">
        <button onclick="switchTab('collection')" id="tabBtnCollection" class="tab-active py-2 px-5 rounded-xl text-sm font-bold flex items-center gap-2 transition">
          <span>🏆</span> 收藏圖鑑
        </button>
        <button onclick="switchTab('orders')" id="tabBtnOrders" class="py-2 px-5 rounded-xl text-sm font-bold text-gray-500 hover:text-pink-600 flex items-center gap-2 transition">
          <span>📦</span> 購買／預購紀錄 (<span id="unpaidBadge" class="text-red-500">0</span>)
        </button>
      </div>
    </div>

    <!-- 狀態提醒列 -->
    <div id="syncStatus" class="text-center text-xs font-bold text-pink-600 mb-4 h-4"></div>

    <!-- 1. 收藏圖鑑 分頁 -->
    <div id="viewCollection">
      <div class="bg-white/95 backdrop-blur-sm p-5 sm:p-6 rounded-3xl shadow-lg shadow-pink-100/70 mb-8 border border-pink-100">
        <h2 class="text-sm font-extrabold mb-4 text-pink-600 flex items-center gap-2">
          <span class="bg-pink-100 p-1 rounded-lg text-pink-500">＋</span> 新增收藏項目
        </h2>

        <!-- 貼網址處 -->
        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-500 mb-1">🔗 官網商品網址（支援繁中與日文網址，貼上自動抓圖與名稱）</label>
          <div class="flex gap-2">
            <input id="colUrl" type="url" 
                   onchange="fetchProductInfo()" 
                   placeholder="https://chiikawamarket.jp/.../products/..." 
                   class="flex-1 border border-pink-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
            <button onclick="fetchProductInfo()" id="btnFetch" class="bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition shrink-0">
              讀取官網資訊
            </button>
          </div>
        </div>

        <!-- 圖片即時預覽與各欄位 -->
        <div class="flex flex-col sm:flex-row gap-4 items-center mb-4">
          <!-- 官方圖即時預覽格 -->
          <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-pink-50/60 border border-pink-200 flex items-center justify-center overflow-hidden shrink-0 shadow-inner">
            <img id="previewImg" src="https://api.iconify.design/fluent-emoji-flat:camera.svg" class="w-full h-full object-contain p-2">
          </div>

          <div class="flex-1 w-full grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="sm:col-span-3">
              <label class="block text-xs font-bold text-gray-500 mb-1">🏷️ 商品品名 (自動帶入)</label>
              <input id="colTitle" type="text" placeholder="貼上網址後自動顯示，可自訂修改" 
                     class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm bg-pink-50/20 focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>
            <div>
              <label class="block text-xs font-bold text-pink-600 mb-1">💴 日幣含稅原價 (自己填)</label>
              <input id="colJpy" type="number" placeholder="例如: 1650" 
                     class="w-full border-2 border-pink-300 rounded-xl px-3.5 py-2 text-sm font-bold text-pink-700 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/30">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">💰 購入金額 (NTD)</label>
              <input id="colBuyTwd" type="number" placeholder="例如: 430" 
                     class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">🐾 角色歸類</label>
              <select id="colCategory" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-pink-400">
                <option value="吉伊卡哇">吉伊卡哇</option>
                <option value="小八貓">小八貓</option>
                <option value="兔兔">兔兔</option>
                <option value="小桃鼠">小桃鼠</option>
                <option value="栗子饅頭">栗子饅頭</option>
                <option value="海獺">海獺勇者</option>
                <option value="獅薩">獅薩</option>
                <option value="古本屋">古本屋</option>
                <option value="其他">其他 / 多人款</option>
              </select>
            </div>
          </div>
        </div>

        <input id="colImage" type="hidden">

        <div class="flex justify-end">
          <button onclick="addCollectionItem()" id="btnColAdd" class="w-full sm:w-auto bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-2.5 px-8 rounded-xl text-sm transition shadow-md shadow-pink-300/50">
            💖 儲存至收藏圖鑑
          </button>
        </div>
      </div>

      <!-- 角色篩選列 -->
      <div class="mb-6 flex flex-wrap items-center gap-2" id="characterFilterButtons"></div>

      <!-- 統計資訊 -->
      <div class="flex flex-wrap justify-between items-center bg-gradient-to-r from-pink-500 to-rose-400 px-5 py-3 rounded-2xl text-white font-bold shadow-md shadow-pink-200 mb-6">
        <div class="text-sm">🎒 <span id="colStatsCount">圖鑑數量：0 件</span></div>
        <div class="text-sm">💵 <span id="colStatsTotal">收藏總投入：NT$ 0</span></div>
      </div>

      <div id="collectionGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-5"></div>
    </div>

    <!-- 2. 購買／預購紀錄 分頁 -->
    <div id="viewOrders" class="hidden">
      <div class="bg-white/95 backdrop-blur-sm p-5 sm:p-6 rounded-3xl shadow-lg shadow-pink-100/70 mb-8 border border-pink-100">
        <h2 class="text-sm font-extrabold mb-4 text-pink-600 flex items-center gap-2">
          <span class="bg-pink-100 p-1 rounded-lg text-pink-500">＋</span> 新增預購／訂金追蹤
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-gray-500 mb-1">預購商品名稱</label>
            <input id="ordTitle" type="text" placeholder="例如：一番賞 A賞吉伊" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm focus:outline-pink-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">角色歸類</label>
            <select id="ordCategory" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm bg-white focus:outline-pink-400">
              <option value="吉伊卡哇">吉伊卡哇</option>
              <option value="小八貓">小八貓</option>
              <option value="兔兔">兔兔</option>
              <option value="小桃鼠">小桃鼠</option>
              <option value="栗子饅頭">栗子饅頭</option>
              <option value="海獺">海獺勇者</option>
              <option value="獅薩">獅薩</option>
              <option value="古本屋">古本屋</option>
              <option value="其他">其他 / 多人款</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">代購 / 賣家備註</label>
            <input id="ordSeller" type="text" placeholder="例如：FB社團、蝦皮" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm focus:outline-pink-400">
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">預購總額 (NTD)</label>
            <input id="ordTotalTwd" type="number" oninput="calcRemaining()" placeholder="例如: 500" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm focus:outline-pink-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-pink-600 mb-1">已付訂金 (NTD)</label>
            <input id="ordDepositTwd" type="number" oninput="calcRemaining()" placeholder="例如: 200" class="w-full border-2 border-pink-300 rounded-xl px-3.5 py-2 text-sm font-bold text-pink-700 focus:outline-pink-500 bg-pink-50/30">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">剩餘尾款 (自動算)</label>
            <input id="ordRemainingTwd" type="number" placeholder="尾款" disabled class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3.5 py-2 text-sm font-bold text-red-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">訂單狀態</label>
            <select id="ordStatus" class="w-full border border-pink-200 rounded-xl px-3.5 py-2 text-sm bg-white focus:outline-pink-400">
              <option value="已付訂金">🟡 已付訂金 (待出貨)</option>
              <option value="尚未付款">🔴 尚未付款</option>
              <option value="已全額結清">🟢 已全額結清</option>
              <option value="已到貨收編">🎉 已到貨收編</option>
            </select>
          </div>
        </div>

        <div class="mt-4 flex justify-end">
          <button onclick="addOrderItem()" id="btnOrdAdd" class="bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-2.5 px-6 rounded-xl text-sm transition shadow-md shadow-pink-300/50">
            📦 儲存預購紀錄
          </button>
        </div>
      </div>

      <div id="orderList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyylu0TrrufOu7fCqR8NJtPYj4Wo4viUlJvBFF6ZvbmgOZ_hOSw64mxSRWtXCEcnFM7/exec"; 

    const CHAR_AVATARS = {
      "全部": "https://api.iconify.design/fluent-emoji-flat:star.svg",
      "吉伊卡哇": "https://api.iconify.design/fluent-emoji-flat:bear.svg",
      "小八貓": "https://api.iconify.design/fluent-emoji-flat:cat.svg",
      "兔兔": "https://api.iconify.design/fluent-emoji-flat:rabbit.svg",
      "小桃鼠": "https://api.iconify.design/fluent-emoji-flat:chipmunk.svg",
      "栗子饅頭": "https://api.iconify.design/fluent-emoji-flat:otter.svg",
      "海獺": "https://api.iconify.design/fluent-emoji-flat:seal.svg",
      "獅薩": "https://api.iconify.design/fluent-emoji-flat:lion.svg",
      "古本屋": "https://api.iconify.design/fluent-emoji-flat:crab.svg",
      "其他": "https://api.iconify.design/fluent-emoji-flat:sparkles.svg"
    };

    let JPY_TO_TWD = 0.215;
    let allItems = [];
    let currentFilter = "全部";

    function switchTab(tab) {
      if (tab === 'collection') {
        document.getElementById('viewCollection').classList.remove('hidden');
        document.getElementById('viewOrders').classList.add('hidden');
        document.getElementById('tabBtnCollection').className = "tab-active py-2 px-5 rounded-xl text-sm font-bold flex items-center gap-2 transition";
        document.getElementById('tabBtnOrders').className = "py-2 px-5 rounded-xl text-sm font-bold text-gray-500 hover:text-pink-600 flex items-center gap-2 transition";
      } else {
        document.getElementById('viewCollection').classList.add('hidden');
        document.getElementById('viewOrders').classList.remove('hidden');
        document.getElementById('tabBtnOrders').className = "tab-active py-2 px-5 rounded-xl text-sm font-bold flex items-center gap-2 transition";
        document.getElementById('tabBtnCollection').className = "py-2 px-5 rounded-xl text-sm font-bold text-gray-500 hover:text-pink-600 flex items-center gap-2 transition";
      }
    }

    function calcRemaining() {
      const total = parseFloat(document.getElementById('ordTotalTwd').value) || 0;
      const deposit = parseFloat(document.getElementById('ordDepositTwd').value) || 0;
      document.getElementById('ordRemainingTwd').value = Math.max(0, total - deposit);
    }

    async function fetchRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/JPY');
        const data = await res.json();
        if (data?.rates?.TWD) JPY_TO_TWD = data.rates.TWD;
      } catch (e) {}
    }

    // 核心：解析官網資料 (自動清洗繁中網址，回歸日文原生 API)
    async function fetchProductInfo() {
      const url = document.getElementById('colUrl').value.trim();
      if (!url) return;

      const match = url.match(/\/products\/([^?#/]+)/);
      if (!match) {
        alert('請確認貼上的是包含 /products/... 的商品頁網址！');
        return;
      }

      const handle = decodeURIComponent(match[1]);
      const btn = document.getElementById('btnFetch');
      btn.innerText = '讀取中...';
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '⏳ 正在連線官網抓取官方美圖...';

      const targetUrl = `https://chiikawamarket.jp/products/${handle}.js`;
      let product = null;

      // 管道 1：AllOrigins (最相容 Shopify .js)
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();
        if (data.contents) product = JSON.parse(data.contents);
      } catch (e) {}

      // 管道 2：Corsproxy
      if (!product || !product.title) {
        try {
          const res2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
          if (res2.ok) product = await res2.json();
        } catch (e) {}
      }

      if (product && product.title) {
        document.getElementById('colTitle').value = product.title;

        // 取得官方高清圖片並補齊網址協定
        let img = product.featured_image || (product.images && product.images[0] ? product.images[0] : '');
        if (typeof img === 'object') img = img.src || '';
        if (img.startsWith('//')) img = 'https:' + img;

        if (img) {
          document.getElementById('colImage').value = img;
          document.getElementById('previewImg').src = img;
        }

        // 智慧判定角色
        const t = product.title;
        if (t.includes('ハチワレ') || t.includes('小八')) document.getElementById('colCategory').value = '小八貓';
        else if (t.includes('うさぎ') || t.includes('兔兔')) document.getElementById('colCategory').value = '兔兔';
        else if (t.includes('モモンガ') || t.includes('小桃')) document.getElementById('colCategory').value = '小桃鼠';
        else if (t.includes('くりまんじゅう') || t.includes('栗子')) document.getElementById('colCategory').value = '栗子饅頭';
        else if (t.includes('ラッコ') || t.includes('海獺')) document.getElementById('colCategory').value = '海獺';
        else if (t.includes('シーサー') || t.includes('獅薩')) document.getElementById('colCategory').value = '獅薩';
        else if (t.includes('カニ') || t.includes('古本屋')) document.getElementById('colCategory').value = '古本屋';
        else if (t.includes('ちいかわ') || t.includes('吉伊')) document.getElementById('colCategory').value = '吉伊卡哇';

        document.getElementById('syncStatus').innerText = '✨ 官方圖片與品名已抓取！請填入日幣原價';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 3000);
      } else {
        alert('抓取受阻，請點擊「讀取官網資訊」重試一次。');
        document.getElementById('syncStatus').innerText = '';
      }

      btn.innerText = '讀取官網資訊';
      btn.disabled = false;
    }

    function renderFilterButtons() {
      const bar = document.getElementById('characterFilterButtons');
      bar.innerHTML = '';
      const chars = ["全部", "吉伊卡哇", "小八貓", "兔兔", "小桃鼠", "栗子饅頭", "海獺", "獅薩", "古本屋"];

      chars.forEach(ch => {
        const activeClass = currentFilter === ch 
          ? "bg-pink-500 text-white shadow-md shadow-pink-200" 
          : "bg-white/80 text-gray-700 hover:bg-pink-50 border border-pink-100";

        const btn = document.createElement('button');
        btn.className = `flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold transition ${activeClass}`;
        btn.onclick = () => {
          currentFilter = ch;
          renderFilterButtons();
          renderCollection();
        };
        btn.innerHTML = `
          <img src="${CHAR_AVATARS[ch] || CHAR_AVATARS['其他']}" class="w-4 h-4 object-contain">
          <span>${ch}</span>
        `;
        bar.appendChild(btn);
      });
    }

    async function loadCloudData() {
      document.getElementById('syncStatus').innerText = '☁️ 雲端載入中...';
      try {
        const res = await fetch(GAS_API_URL);
        allItems = await res.json();
        renderCollection();
        renderOrders();
        document.getElementById('syncStatus').innerText = '';
      } catch (e) {
        document.getElementById('syncStatus').innerText = '連線失敗';
      }
    }

    async function addCollectionItem() {
      const title = document.getElementById('colTitle').value.trim();
      const jpy = document.getElementById('colJpy').value.trim();
      const buyPrice = document.getElementById('colBuyTwd').value.trim();
      const category = document.getElementById('colCategory').value;
      const img = document.getElementById('colImage').value.trim();
      const url = document.getElementById('colUrl').value.trim();

      if (!title) return alert('請先貼上網址讀取品名！');
      if (!jpy) return alert('請填寫日幣含稅原價（例如 1650）！');

      const btn = document.getElementById('btnColAdd');
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '☁️ 儲存至雲端中...';

      const jpyVal = parseFloat(jpy);
      const buyVal = buyPrice ? parseFloat(buyPrice) : 0;
      const twdOrig = Math.round(jpyVal * JPY_TO_TWD);

      const newItem = {
        id: "COL_" + Date.now(),
        title: title,
        category: category,
        jpyPrice: jpyVal,
        twdOriginalPrice: twdOrig,
        buyPriceTwd: buyVal,
        imageUrl: img || CHAR_AVATARS[category] || CHAR_AVATARS['其他'],
        url: url || "#",
        type: "collection"
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', item: newItem })
        });

        allItems.unshift(newItem);
        renderCollection();

        document.getElementById('colUrl').value = '';
        document.getElementById('colTitle').value = '';
        document.getElementById('colJpy').value = '';
        document.getElementById('colBuyTwd').value = '';
        document.getElementById('colImage').value = '';
        document.getElementById('previewImg').src = 'https://api.iconify.design/fluent-emoji-flat:camera.svg';

        document.getElementById('syncStatus').innerText = '✅ 成功加入收藏圖鑑！';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 2500);
      } catch (err) {
        alert('存入失敗');
      } finally {
        btn.disabled = false;
      }
    }

    async function addOrderItem() {
      const title = document.getElementById('ordTitle').value.trim();
      const category = document.getElementById('ordCategory').value;
      const seller = document.getElementById('ordSeller').value.trim() || '未備註';
      const total = parseFloat(document.getElementById('ordTotalTwd').value) || 0;
      const deposit = parseFloat(document.getElementById('ordDepositTwd').value) || 0;
      const status = document.getElementById('ordStatus').value;

      if (!title) return alert('請填寫預購商品名稱！');
      if (total <= 0) return alert('請填寫預購總額！');

      const btn = document.getElementById('btnOrdAdd');
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '☁️ 正在記錄預購訂單...';

      const newItem = {
        id: "ORD_" + Date.now(),
        title: title,
        category: category,
        jpyPrice: total,
        twdOriginalPrice: deposit,
        buyPriceTwd: Math.max(0, total - deposit),
        imageUrl: seller,
        url: status,
        type: "order"
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', item: newItem })
        });

        allItems.unshift(newItem);
        renderOrders();

        document.getElementById('ordTitle').value = '';
        document.getElementById('ordSeller').value = '';
        document.getElementById('ordTotalTwd').value = '';
        document.getElementById('ordDepositTwd').value = '';
        document.getElementById('ordRemainingTwd').value = '';
        document.getElementById('syncStatus').innerText = '✅ 預購記錄已儲存！';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 2500);
      } catch (err) {
        alert('存入失敗');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteItem(id) {
      if (!confirm('確定要從雲端刪除這筆資料嗎？')) return;
      allItems = allItems.filter(item => item.id != id);
      renderCollection();
      renderOrders();

      await fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id })
      });
    }

    function renderCollection() {
      const container = document.getElementById('collectionGrid');
      container.innerHTML = '';

      let totalSpend = 0;
      let count = 0;

      const collections = allItems.filter(item => !String(item.id).startsWith("ORD_"));
      const filtered = collections.filter(item => currentFilter === "全部" || item.category === currentFilter);

      filtered.forEach(item => {
        totalSpend += parseFloat(item.buyPriceTwd) || 0;
        count++;

        const diff = item.buyPriceTwd - item.twdOriginalPrice;
        const diffTag = item.buyPriceTwd > 0 
          ? (diff > 0 ? `<span class="text-rose-500 font-extrabold">+${diff} (溢價)</span>` : `<span class="text-emerald-600 font-extrabold">${diff} (折扣)</span>`) 
          : '-';

        const avatar = CHAR_AVATARS[item.category] || CHAR_AVATARS['其他'];

        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden flex flex-col border border-pink-100/80 group";
        card.innerHTML = `
          <div class="relative pt-[100%] bg-gradient-to-b from-pink-50/50 to-white overflow-hidden">
            <img src="${item.imageUrl}" 
                 onerror="this.onerror=null;this.src='${avatar}';" 
                 class="absolute inset-0 w-full h-full object-contain p-3 group-hover:scale-105 transition duration-300">
            <span class="absolute top-2.5 left-2.5 bg-white/90 backdrop-blur text-pink-700 text-[11px] px-2.5 py-1 rounded-full font-bold flex items-center gap-1.5 shadow-sm border border-pink-100">
              <img src="${avatar}" class="w-3.5 h-3.5 object-contain">
              ${item.category}
            </span>
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2 mb-2 group-hover:text-pink-600 transition" title="${item.title}">
                ${item.title}
              </div>
              <div class="text-[11px] text-gray-500 space-y-1 bg-amber-50/50 p-2 rounded-xl">
                <div>官網原價：<b class="text-gray-700">¥${Number(item.jpyPrice).toLocaleString()}</b> <span class="text-[10px] text-gray-400">(約 NT$ ${item.twdOriginalPrice})</span></div>
                <div>購入價格：<b class="text-pink-600 font-bold">NT$ ${item.buyPriceTwd}</b></div>
                <div>價差比較：${diffTag}</div>
              </div>
            </div>
            <div class="pt-2 mt-2 border-t border-gray-100 flex justify-between items-center text-xs">
              ${item.url && item.url !== '#' ? `<a href="${item.url}" target="_blank" class="text-pink-400 hover:text-pink-600 font-bold text-[11px]">官網連結 ↗</a>` : '<span></span>'}
              <button onclick="deleteItem('${item.id}')" class="text-gray-300 hover:text-rose-500 transition">刪除</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('colStatsCount').innerText = `圖鑑數量：${count} 件`;
      document.getElementById('colStatsTotal').innerText = `收藏總投入：NT$ ${totalSpend.toLocaleString()}`;
    }

    function renderOrders() {
      const container = document.getElementById('orderList');
      container.innerHTML = '';

      const orders = allItems.filter(item => String(item.id).startsWith("ORD_"));
      let pendingCount = 0;

      orders.forEach(item => {
        const total = item.jpyPrice;
        const deposit = item.twdOriginalPrice;
        const remaining = item.buyPriceTwd;
        const seller = item.imageUrl;
        const status = item.url;
        const avatar = CHAR_AVATARS[item.category] || CHAR_AVATARS['其他'];

        if (status !== '已到貨收編') pendingCount++;

        let statusBg = "bg-amber-100 text-amber-800 border-amber-300";
        if (status === '已全額結清') statusBg = "bg-blue-100 text-blue-800 border-blue-300";
        if (status === '已到貨收編') statusBg = "bg-emerald-100 text-emerald-800 border-emerald-300";
        if (status === '尚未付款') statusBg = "bg-rose-100 text-rose-800 border-rose-300";

        const card = document.createElement('div');
        card.className = "bg-white p-4 sm:p-5 rounded-3xl shadow-sm border border-pink-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4";
        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-2xl bg-pink-50 flex items-center justify-center p-2.5 shrink-0 border border-pink-100 shadow-inner">
              <img src="${avatar}" class="w-full h-full object-contain">
            </div>
            <div>
              <div class="font-extrabold text-sm sm:text-base text-gray-800 flex items-center gap-2">
                <span>${item.title}</span>
                <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold border ${statusBg}">${status}</span>
              </div>
              <div class="text-xs text-gray-400 mt-1">
                角色：<span class="text-pink-600 font-bold">${item.category}</span> ｜ 來源管道：${seller}
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between sm:justify-end gap-5 border-t sm:border-t-0 pt-3 sm:pt-0">
            <div class="text-right text-xs">
              <div class="text-gray-500 font-medium">總額: NT$ ${total} ｜ <span class="text-pink-600 font-bold">已付訂金: NT$ ${deposit}</span></div>
              <div class="text-sm font-extrabold text-rose-500 mt-0.5">剩餘尾款: NT$ ${remaining}</div>
            </div>
            <button onclick="deleteItem('${item.id}')" class="text-gray-300 hover:text-rose-500 pl-2 transition">刪除</button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('unpaidBadge').innerText = pendingCount;
    }

    renderFilterButtons();
    fetchRate();
    loadCloudData();
  </script>
</body>
</html>
