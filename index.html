<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入多款日系高質感字體 -->

            </div>
            <div>
              <label class="block text-xs font-bold text-[#706251] mb-1">🐾 角色歸類</label>
              <select id="ordCategory" class="oatmeal-input w-full rounded-2xl px-3.5 py-2 text-xs sm:text-sm bg-white">
                <option value="吉伊卡哇">吉伊卡哇</option>
                <option value="小八貓">小八貓</option>
                <option value="兔兔">兔兔</option>
                <option value="小桃鼠">小桃鼠</option>
                <option value="栗子饅頭">栗子饅頭</option>
                <option value="海獺">海獺勇者</option>
                <option value="獅薩">獅薩</option>
                <option value="古本屋">古本屋</option>
                <option value="海妖">海妖塞壬</option>
                <option value="島二郎">島二郎</option>

              </select>
            </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyylu0TrrufOu7fCqR8NJtPYj4Wo4viUlJvBFF6ZvbmgOZ_hOSw64mxSRWtXCEcnFM7/exec"; 

    const CHAR_AVATARS = {
      "全部": "https://api.iconify.design/fluent-emoji-flat:star.svg",
      "吉伊卡哇": "https://api.iconify.design/fluent-emoji-flat:bear.svg",
      "小八貓": "https://api.iconify.design/fluent-emoji-flat:cat.svg",
      "兔兔": "https://api.iconify.design/fluent-emoji-flat:rabbit.svg",
      "小桃鼠": "https://api.iconify.design/fluent-emoji-flat:chipmunk.svg",
      "栗子饅頭": "https://api.iconify.design/fluent-emoji-flat:otter.svg",
      "海獺": "https://api.iconify.design/fluent-emoji-flat:seal.svg",
      "獅薩": "https://api.iconify.design/fluent-emoji-flat:lion.svg",
      "古本屋": "https://api.iconify.design/fluent-emoji-flat:crab.svg",
      "海妖": "https://api.iconify.design/fluent-emoji-flat:mermaid.svg",
      "島二郎": "https://api.iconify.design/fluent-emoji-flat:cook.svg",
      "其他": "https://api.iconify.design/fluent-emoji-flat:sparkles.svg"
    };

    let JPY_TO_TWD = 0.215;
    let allItems = [];
    let currentFilter = "全部";

    function changeGlobalFont(fontClass) {
      const body = document.getElementById('pageBody');
      body.classList.remove('font-zen', 'font-mplus', 'font-noto', 'font-kosugi');
      body.classList.add(fontClass);
      localStorage.setItem('user_selected_font', fontClass);
    }

    function initUserFont() {
      const saved = localStorage.getItem('user_selected_font');
      if (saved) {
        changeGlobalFont(saved);
        document.getElementById('fontSelector').value = saved;
      }
    }

    function switchTab(tab) {
      if (tab === 'collection') {
        document.getElementById('viewCollection').classList.remove('hidden');
        document.getElementById('viewOrders').classList.add('hidden');
        document.getElementById('tabBtnCollection').className = "tab-active py-2 px-6 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition duration-200";
        document.getElementById('tabBtnOrders').className = "text-[#786b59] hover:text-[#43382b] py-2 px-6 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition duration-200";
      } else {
        document.getElementById('viewCollection').classList.add('hidden');
        document.getElementById('viewOrders').classList.remove('hidden');
        document.getElementById('tabBtnOrders').className = "tab-active py-2 px-6 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition duration-200";
        document.getElementById('tabBtnCollection').className = "text-[#786b59] hover:text-[#43382b] py-2 px-6 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition duration-200";
      }
    }

    function calcRemaining() {
      const total = parseFloat(document.getElementById('ordTotalTwd').value) || 0;
      const deposit = parseFloat(document.getElementById('ordDepositTwd').value) || 0;
      document.getElementById('ordRemainingTwd').value = Math.max(0, total - deposit);
    }

    async function fetchRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/JPY');
        const data = await res.json();
        if (data?.rates?.TWD) JPY_TO_TWD = data.rates.TWD;
      } catch (e) {}
    }

    // ★ 終極多管道抓取器 (支援轉址與防快取阻擋) ★
    async function scrapeOfficialProduct(url) {
      if (!url) return null;

      // 精準提取 /products/ 後面的真實 ID
      const match = url.match(/\/products\/([^\/\?#]+)/);
      if (!match) return null;
      
      const handle = decodeURIComponent(match[1]);
      const targetJsUrl = `https://chiikawamarket.jp/products/${handle}.js`;

      let product = null;

      // 管道 1：Allorigins 直接提取內容
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetJsUrl)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.contents) product = JSON.parse(data.contents);
        }
      } catch (e) {}

      // 管道 2：Corsproxy 備用
      if (!product || !product.title) {
        try {
          const res2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetJsUrl)}`);
          if (res2.ok) product = await res2.json();
        } catch (e) {}
      }

      // 管道 3：Google Apps Script (明確追蹤轉址)
      if (!product || !product.title) {
        try {
          const gasRes = await fetch(GAS_API_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'scrape', handle: handle })
          });
          if (gasRes.ok) {
            const data3 = await gasRes.json();
            if (data3 && data3.title) product = data3;
          }
        } catch (e) {}
      }

      if (product && product.title) {
        let img = product.featured_image || (product.images && product.images[0] ? product.images[0] : '');
        if (typeof img === 'object') img = img.src || '';
        if (img.startsWith('//')) img = 'https:' + img;

        let matchedCat = '其他';
        const t = product.title;
        if (t.includes('ハチワレ') || t.includes('小八')) matchedCat = '小八貓';
        else if (t.includes('うさぎ') || t.includes('兔兔')) matchedCat = '兔兔';
        else if (t.includes('モモンガ') || t.includes('小桃')) matchedCat = '小桃鼠';
        else if (t.includes('くりまんじゅう') || t.includes('栗子')) matchedCat = '栗子饅頭';
        else if (t.includes('ラッコ') || t.includes('海獺')) matchedCat = '海獺';
        else if (t.includes('シーサー') || t.includes('獅薩')) matchedCat = '獅薩';
        else if (t.includes('カニ') || t.includes('古本屋')) matchedCat = '古本屋';
        else if (t.includes('セイレーン') || t.includes('海妖')) matchedCat = '海妖';
        else if (t.includes('島二郎')) matchedCat = '島二郎';
        else if (t.includes('ちいかわ') || t.includes('吉伊')) matchedCat = '吉伊卡哇';

        return { title: product.title, image: img, category: matchedCat };
      }
      return null;
    }

    async function fetchProductForCollection() {
      const url = document.getElementById('colUrl').value.trim();
      if (!url) return;
      const btn = document.getElementById('btnFetchCol');
      btn.innerText = '讀取中...';
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '⏳ 正在讀取官方商品資料...';

      const data = await scrapeOfficialProduct(url);
      if (data) {
        document.getElementById('colTitle').value = data.title;
        document.getElementById('colCategory').value = data.category;
        if (data.image) {
          document.getElementById('colImage').value = data.image;
          document.getElementById('previewColImg').src = data.image;
        }
        document.getElementById('syncStatus').innerText = '✨ 官方照片與品名已就緒！請填寫日幣原價';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 3000);
      } else {
        alert('抓取受阻，請再次點擊「讀取商品資訊」試試看！');
        document.getElementById('syncStatus').innerText = '';
      }
      btn.innerText = '🪄 讀取商品資訊';
      btn.disabled = false;
    }

    async function fetchProductForOrder() {
      const url = document.getElementById('ordUrl').value.trim();
      if (!url) return;
      const btn = document.getElementById('btnFetchOrd');
      btn.innerText = '讀取中...';
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '⏳ 正在讀取預購官方美圖...';

      const data = await scrapeOfficialProduct(url);
      if (data) {
        document.getElementById('ordTitle').value = data.title;
        document.getElementById('ordCategory').value = data.category;
        if (data.image) {
          document.getElementById('ordImage').value = data.image;
          document.getElementById('previewOrdImg').src = data.image;
        }
        document.getElementById('syncStatus').innerText = '✨ 預購美圖與品名已就緒！請填寫價格與訂金';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 3000);
      } else {
        alert('抓取受阻，請再次點擊「讀取資訊」重試一次！');
        document.getElementById('syncStatus').innerText = '';
      }
      btn.innerText = '🪄 讀取資訊';
      btn.disabled = false;
    }

    function renderFilterButtons() {
      const bar = document.getElementById('characterFilterButtons');
      bar.innerHTML = '';
      const chars = ["全部", "吉伊卡哇", "小八貓", "兔兔", "小桃鼠", "栗子饅頭", "海獺", "獅薩", "古本屋", "海妖", "島二郎"];

      chars.forEach(ch => {
        const activeClass = currentFilter === ch 
          ? "bg-[#57493a] text-white shadow-sm scale-105" 
          : "bg-white/90 text-[#635544] hover:bg-[#eae5dc] border border-[#e5dfd5]";

        const btn = document.createElement('button');
        btn.className = `flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all duration-200 ${activeClass}`;
        btn.onclick = () => {
          currentFilter = ch;
          renderFilterButtons();
          renderCollection();
        };
        btn.innerHTML = `
          <img src="${CHAR_AVATARS[ch] || CHAR_AVATARS['其他']}" class="w-4 h-4 object-contain">
          <span>${ch}</span>
        `;
        bar.appendChild(btn);
      });
    }

    async function loadCloudData() {
      document.getElementById('syncStatus').innerText = '☁️ 雲端同步載入中...';
      try {
        const res = await fetch(GAS_API_URL);
        allItems = await res.json();
        renderCollection();
        renderOrders();
        document.getElementById('syncStatus').innerText = '';
      } catch (e) {
        document.getElementById('syncStatus').innerText = '連線失敗';
      }
    }

    async function addCollectionItem() {
      const title = document.getElementById('colTitle').value.trim();
      const jpy = document.getElementById('colJpy').value.trim();
      const buyPrice = document.getElementById('colBuyTwd').value.trim();
      const category = document.getElementById('colCategory').value;
      const img = document.getElementById('colImage').value.trim();
      const url = document.getElementById('colUrl').value.trim();

      if (!title) return alert('請先貼上網址讀取品名！');
      if (!jpy) return alert('請填寫日幣含稅原價（例如 1650）！');

      const btn = document.getElementById('btnColAdd');
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '☁️ 儲存至雲端中...';

      const jpyVal = parseFloat(jpy);
      const buyVal = buyPrice ? parseFloat(buyPrice) : 0;
      const twdOrig = Math.round(jpyVal * JPY_TO_TWD);

      const newItem = {
        id: "COL_" + Date.now(),
        title: title,
        category: category,
        jpyPrice: jpyVal,
        twdOriginalPrice: twdOrig,
        buyPriceTwd: buyVal,
        imageUrl: img || CHAR_AVATARS[category] || CHAR_AVATARS['其他'],
        url: url || "#",
        type: "collection"
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', item: newItem })
        });

        allItems.unshift(newItem);
        renderCollection();

        document.getElementById('colUrl').value = '';
        document.getElementById('colTitle').value = '';
        document.getElementById('colJpy').value = '';
        document.getElementById('colBuyTwd').value = '';
        document.getElementById('colImage').value = '';
        document.getElementById('previewColImg').src = 'https://api.iconify.design/fluent-emoji-flat:camera.svg';

        document.getElementById('syncStatus').innerText = '✅ 成功收錄至圖鑑！';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 2500);
      } catch (err) {
        alert('存入失敗');
      } finally {
        btn.disabled = false;
      }
    }

    async function addOrderItem() {
      const title = document.getElementById('ordTitle').value.trim();
      const category = document.getElementById('ordCategory').value;
      const seller = document.getElementById('ordSeller').value.trim() || '未備註';
      const total = parseFloat(document.getElementById('ordTotalTwd').value) || 0;
      const deposit = parseFloat(document.getElementById('ordDepositTwd').value) || 0;
      const status = document.getElementById('ordStatus').value;
      const img = document.getElementById('ordImage').value.trim();
      const url = document.getElementById('ordUrl').value.trim();

      if (!title) return alert('請填寫預購商品名稱！');
      if (total <= 0) return alert('請填寫預購總額！');

      const btn = document.getElementById('btnOrdAdd');
      btn.disabled = true;
      document.getElementById('syncStatus').innerText = '☁️ 正在記錄預購訂單...';

      const newItem = {
        id: "ORD_" + Date.now(),
        title: title,
        category: category,
        jpyPrice: total,
        twdOriginalPrice: deposit,
        buyPriceTwd: Math.max(0, total - deposit),
        imageUrl: img || CHAR_AVATARS[category] || CHAR_AVATARS['其他'],
        url: JSON.stringify({ status: status, seller: seller, link: url || '#' }),
        type: "order"
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', item: newItem })
        });

        allItems.unshift(newItem);
        renderOrders();

        document.getElementById('ordUrl').value = '';
        document.getElementById('ordTitle').value = '';
        document.getElementById('ordSeller').value = '';
        document.getElementById('ordTotalTwd').value = '';
        document.getElementById('ordDepositTwd').value = '';
        document.getElementById('ordRemainingTwd').value = '';
        document.getElementById('ordImage').value = '';
        document.getElementById('previewOrdImg').src = 'https://api.iconify.design/fluent-emoji-flat:package.svg';

        document.getElementById('syncStatus').innerText = '✅ 預購記錄已儲存！';
        setTimeout(() => document.getElementById('syncStatus').innerText = '', 2500);
      } catch (err) {
        alert('存入失敗');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteItem(id) {
      if (!confirm('確定要從雲端刪除這筆資料嗎？')) return;
      allItems = allItems.filter(item => item.id != id);
      renderCollection();
      renderOrders();

      await fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id })
      });
    }

    function renderCollection() {
      const container = document.getElementById('collectionGrid');
      container.innerHTML = '';

      let totalSpend = 0;
      let count = 0;

      const collections = allItems.filter(item => !String(item.id).startsWith("ORD_"));
      const filtered = collections.filter(item => currentFilter === "全部" || item.category === currentFilter);

      filtered.forEach(item => {
        totalSpend += parseFloat(item.buyPriceTwd) || 0;
        count++;

        const diff = item.buyPriceTwd - item.twdOriginalPrice;
        const diffTag = item.buyPriceTwd > 0 
          ? (diff > 0 ? `<span class="text-[#c2410c] font-bold">+${diff} (溢價)</span>` : `<span class="text-[#15803d] font-bold">${diff} (折扣)</span>`) 
          : '-';

        const avatar = CHAR_AVATARS[item.category] || CHAR_AVATARS['其他'];

        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 overflow-hidden flex flex-col border border-[#ede8df] group";
        card.innerHTML = `
          <div class="relative pt-[100%] bg-[#faf8f5] overflow-hidden">
            <img src="${item.imageUrl}" 
                 onerror="this.onerror=null;this.src='${avatar}';" 
                 class="absolute inset-0 w-full h-full object-contain p-3 group-hover:scale-105 transition duration-300">
            <span class="absolute top-2.5 left-2.5 bg-white/95 text-[#5c4d3c] text-[11px] px-2.5 py-1 rounded-full font-bold flex items-center gap-1.5 shadow-sm border border-[#e8e2d8]">
              <img src="${avatar}" class="w-3.5 h-3.5 object-contain">
              ${item.category}
            </span>
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs sm:text-sm font-bold text-[#382f25] line-clamp-2 mb-2 group-hover:text-[#b45309] transition" title="${item.title}">
                ${item.title}
              </div>
              <div class="text-[11px] text-[#786b59] space-y-1 bg-[#f7f5f0] p-2.5 rounded-2xl border border-[#ebe5dc]">
                <div>官網原價：<b class="text-[#43382b]">¥${Number(item.jpyPrice).toLocaleString()}</b> <span class="text-[10px] text-[#9c8e7c]">(約 NT$ ${item.twdOriginalPrice})</span></div>
                <div>購入價格：<b class="text-[#92400e] font-bold">NT$ ${item.buyPriceTwd}</b></div>
                <div>價差比較：${diffTag}</div>
              </div>
            </div>
            <div class="pt-2 mt-2 border-t border-[#f4f0e8] flex justify-between items-center text-xs">
              ${item.url && item.url !== '#' ? `<a href="${item.url}" target="_blank" class="text-[#92400e] hover:underline font-bold text-[11px]">官網查看 ↗</a>` : '<span></span>'}
              <button onclick="deleteItem('${item.id}')" class="text-[#a89b8a] hover:text-red-500 font-bold transition">刪除</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('colStatsCount').innerText = `圖鑑數量：${count} 件`;
      document.getElementById('colStatsTotal').innerText = `收藏總投入：NT$ ${totalSpend.toLocaleString()}`;
    }

    function renderOrders() {
      const container = document.getElementById('orderList');
      container.innerHTML = '';

      const orders = allItems.filter(item => String(item.id).startsWith("ORD_"));
      let pendingCount = 0;

      orders.forEach(item => {
        const total = item.jpyPrice;
        const deposit = item.twdOriginalPrice;
        const remaining = item.buyPriceTwd;
        const avatar = CHAR_AVATARS[item.category] || CHAR_AVATARS['其他'];

        let status = "已付訂金";
        let seller = "未備註";
        let link = "#";
        try {
          const parsed = JSON.parse(item.url);
          status = parsed.status || status;
          seller = parsed.seller || seller;
          link = parsed.link || link;
        } catch (e) {
          status = item.url || status;
          seller = item.imageUrl && !item.imageUrl.startsWith('http') ? item.imageUrl : '未備註';
        }

        if (status !== '已到貨收編') pendingCount++;

        let statusBg = "bg-amber-50 text-amber-900 border-amber-200";
        if (status === '已全額結清') statusBg = "bg-sky-50 text-sky-900 border-sky-200";
        if (status === '已到貨收編') statusBg = "bg-emerald-50 text-emerald-900 border-emerald-200";
        if (status === '尚未付款') statusBg = "bg-rose-50 text-rose-900 border-rose-200";

        const displayImg = (item.imageUrl && item.imageUrl.startsWith('http')) ? item.imageUrl : avatar;

        const card = document.createElement('div');
        card.className = "bg-white p-4 sm:p-5 rounded-3xl shadow-sm hover:shadow-md transition border border-[#ede8df] flex flex-col sm:flex-row sm:items-center justify-between gap-4";
        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-16 h-16 rounded-2xl bg-[#faf8f5] flex items-center justify-center p-1.5 shrink-0 border border-[#e8e2d8] overflow-hidden shadow-inner">
              <img src="${displayImg}" class="w-full h-full object-contain">
            </div>
            <div>
              <div class="font-bold text-sm sm:text-base text-[#382f25] flex items-center gap-2">
                <span>${item.title}</span>
                <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold border ${statusBg}">${status}</span>
              </div>
              <div class="text-xs text-[#786b59] mt-1 flex items-center gap-2">
                <span>🐾 角色：<b class="text-[#57493a]">${item.category}</b></span>
                <span>•</span>
                <span>🛍️ 來源：${seller}</span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between sm:justify-end gap-5 border-t sm:border-t-0 pt-3 sm:pt-0">
            <div class="text-right text-xs">
              <div class="text-[#786b59] font-medium">總額: NT$ ${total} ｜ <span class="text-[#92400e] font-bold">已付訂金: NT$ ${deposit}</span></div>
              <div class="text-sm font-bold text-[#b45309] mt-0.5">剩餘尾款: NT$ ${remaining}</div>
            </div>
            <button onclick="deleteItem('${item.id}')" class="text-[#a89b8a] hover:text-red-500 font-bold pl-2 transition">刪除</button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('unpaidBadge').innerText = pendingCount;
    }

    initUserFont();
    renderFilterButtons();
    fetchRate();
    loadCloudData();
  </script>
</body>
</html>
