<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉伊卡哇吊飾＆小物收藏庫 (雲端同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 p-4 sm:p-8">

  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-pink-600 mb-2">✨ 吉伊卡哇吊飾收藏記錄本 ✨</h1>
      <p class="text-sm text-gray-500">雲端同步版：手機、平板隨時同步更新 ☁️</p>
    </header>

    <!-- 輸入控制板 -->
    <div class="bg-white p-6 rounded-2xl shadow-md mb-8 border border-pink-100">
      <h2 class="text-lg font-bold mb-4 text-gray-700">＋ 新增收藏項目</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-500 mb-1">官網商品網址</label>
          <input id="productUrl" type="url" placeholder="https://chiikawamarket.jp/.../products/..." 
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-pink-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">日幣原價 (選填，自動含稅)</label>
          <input id="customJpy" type="number" placeholder="留空自動抓取 / 如: 1650" 
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-pink-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">你的購入金額 (NTD)</label>
          <input id="buyPriceTwd" type="number" placeholder="例如: 430" 
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-pink-400">
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">角色歸類</label>
          <select id="charCategory" class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-pink-400">
            <option value="吉伊卡哇">吉伊卡哇</option>
            <option value="小八貓">小八貓</option>
            <option value="兔兔">兔兔</option>
            <option value="小桃鼠">小桃鼠</option>
            <option value="栗子饅頭">栗子饅頭</option>
            <option value="海獺">海獺</option>
            <option value="獅薩">獅薩</option>
            <option value="古本屋">古本屋</option>
            <option value="其他">其他 / 多人款</option>
          </select>
        </div>
        <div class="md:col-span-3 flex justify-between items-end">
          <span id="syncStatus" class="text-xs text-pink-600 font-medium"></span>
          <button id="addBtn" onclick="addItem()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
            解析並同步儲存
          </button>
        </div>
      </div>
    </div>

    <!-- 篩選與數據統計 -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold">角色篩選：</span>
        <select id="filterCategory" onchange="renderItems()" class="border rounded-lg px-3 py-1 text-sm bg-white">
          <option value="ALL">全部角色</option>
          <option value="吉伊卡哇">吉伊卡哇</option>
          <option value="小八貓">小八貓</option>
          <option value="兔兔">兔兔</option>
          <option value="小桃鼠">小桃鼠</option>
          <option value="栗子饅頭">栗子饅頭</option>
          <option value="海獺">海獺</option>
          <option value="獅薩">獅薩</option>
          <option value="古本屋">古本屋</option>
          <option value="其他">其他 / 多人款</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadFromCloud()" class="text-xs text-pink-600 hover:underline">🔄 重新整理雲端資料</button>
        <div class="text-sm bg-pink-100 text-pink-700 px-4 py-2 rounded-xl font-medium" id="statsBox">
          雲端載入中...
        </div>
      </div>
    </div>

    <!-- 卡片展示列表 -->
    <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyylu0TrrufOu7fCqR8NJtPYj4Wo4viUlJvBFF6ZvbmgOZ_hOSw64mxSRWtXCEcnFM7/exec"; 

    let JPY_TO_TWD = 0.215;
    let myCollection = [];

    async function fetchRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/JPY');
        const data = await res.json();
        if (data?.rates?.TWD) JPY_TO_TWD = data.rates.TWD;
      } catch (e) {
        console.warn('匯率載入失敗，採用預設值 0.215');
      }
    }

    async function loadFromCloud() {
      document.getElementById('statsBox').innerText = '雲端讀取中...';
      try {
        const res = await fetch(GAS_API_URL);
        myCollection = await res.json();
        renderItems();
      } catch (err) {
        document.getElementById('statsBox').innerText = '讀取失敗';
        console.error(err);
      }
    }

    async function fetchProductData(handle) {
      const targetUrl = `https://chiikawamarket.jp/products/${handle}.js`;
      try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
        if (res.ok) return await res.json();
      } catch (e) {}

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();
        if (data?.contents) return JSON.parse(data.contents);
      } catch (e) {}

      throw new Error('抓取失敗');
    }

    async function addItem() {
      const urlInput = document.getElementById('productUrl').value.trim();
      const buyPrice = document.getElementById('buyPriceTwd').value.trim();
      const customJpy = document.getElementById('customJpy').value.trim();
      const category = document.getElementById('charCategory').value;
      const addBtn = document.getElementById('addBtn');
      const syncStatus = document.getElementById('syncStatus');

      if (!urlInput) return alert('請先貼上官網商品網址！');
      
      const match = urlInput.match(/\/products\/([^?#/]+)/);
      if (!match) return alert('網址格式無法辨識，請貼上包含 /products/... 的商品頁網址！');
      
      const productHandle = decodeURIComponent(match[1]);

      addBtn.disabled = true;
      syncStatus.innerText = '⏳ 正在讀取官網資訊...';

      let title = '';
      let jpyPrice = 0;
      let imageUrl = '';

      try {
        const product = await fetchProductData(productHandle);
        title = product.title;
        
        if (customJpy) {
          // 如果使用者有自行手動填寫日幣原價，以手動輸入為準
          jpyPrice = parseFloat(customJpy);
        } else {
          // 自動解析官網價格並加上日本 10% 消費稅
          let rawPrice = (product.variants && product.variants.length > 0) ? product.variants[0].price : product.price;
          rawPrice = parseFloat(rawPrice);
          if (rawPrice > 50000) rawPrice = rawPrice / 100;
          
          // 若官網給的是未稅價 (如 1500)，乘以 1.1 轉為含稅價 1650
          jpyPrice = Math.round(rawPrice * 1.1);
        }

        imageUrl = product.featured_image ? product.featured_image : (product.images?.[0] || '');
      } catch (err) {
        title = prompt('請直接輸入「商品名稱」：', '吉伊卡哇吊飾');
        if (!title) {
          addBtn.disabled = false;
          syncStatus.innerText = '';
          return;
        }
        const promptPrice = customJpy || prompt('請輸入「日幣含稅原價」（例如 1650）：', '1650');
        jpyPrice = parseFloat(promptPrice) || 0;
        imageUrl = 'https://chiikawamarket.jp/cdn/shop/files/chiikawa_logo.png';
      }

      const twdOriginalPrice = Math.round(jpyPrice * JPY_TO_TWD);

      const newItem = {
        id: Date.now(),
        title: title,
        category: category,
        jpyPrice: jpyPrice,
        twdOriginalPrice: twdOriginalPrice,
        buyPriceTwd: buyPrice ? parseFloat(buyPrice) : 0,
        imageUrl: imageUrl.startsWith('//') ? 'https:' + imageUrl : imageUrl,
        url: urlInput
      };

      syncStatus.innerText = '☁️ 正在同步存入 Google 試算表...';
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', item: newItem })
        });

        myCollection.unshift(newItem);
        renderItems();
        document.getElementById('productUrl').value = '';
        document.getElementById('buyPriceTwd').value = '';
        document.getElementById('customJpy').value = '';
        syncStatus.innerText = '✅ 同步成功！';
        setTimeout(() => syncStatus.innerText = '', 3000);
      } catch (e) {
        alert('存入雲端失敗，請檢查網路。');
      } finally {
        addBtn.disabled = false;
      }
    }

    async function deleteItem(id) {
      if (!confirm('確定要從雲端刪除這筆收藏嗎？')) return;
      myCollection = myCollection.filter(item => item.id != id);
      renderItems();

      await fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id })
      });
    }

    function renderItems() {
      const filter = document.getElementById('filterCategory').value;
      const container = document.getElementById('itemList');
      container.innerHTML = '';

      let totalSpend = 0;
      let count = 0;
      const filtered = myCollection.filter(item => filter === 'ALL' || item.category === filter);

      filtered.forEach(item => {
        totalSpend += parseFloat(item.buyPriceTwd) || 0;
        count++;
        const diff = item.buyPriceTwd - item.twdOriginalPrice;
        const diffTag = item.buyPriceTwd > 0 
          ? (diff > 0 ? `<span class="text-red-500 font-bold">+${diff} (溢價)</span>` : `<span class="text-green-600 font-bold">${diff} (折扣)</span>`) 
          : '-';

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow overflow-hidden flex flex-col border border-gray-100 hover:shadow-md transition";
        card.innerHTML = `
          <div class="relative pt-[100%] bg-gray-50 overflow-hidden">
            <img src="${item.imageUrl}" alt="${item.title}" class="absolute inset-0 w-full h-full object-contain p-2 hover:scale-105 transition duration-300">
            <span class="absolute top-2 left-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-medium shadow">${item.category}</span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <a href="${item.url}" target="_blank" class="text-sm font-semibold hover:text-pink-600 line-clamp-2 mb-2" title="${item.title}">
                ${item.title}
              </a>
              <div class="text-xs text-gray-500 space-y-1 mb-3">
                <div>官網原價：¥${Number(item.jpyPrice).toLocaleString()} (約 NT$ ${item.twdOriginalPrice})</div>
                <div class="text-sm">購入金額：<b class="text-slate-800">NT$ ${item.buyPriceTwd}</b></div>
                <div class="text-[11px]">價差比較：${diffTag}</div>
              </div>
            </div>
            <div class="pt-2 border-t border-gray-100 flex justify-between items-center text-xs">
              <a href="${item.url}" target="_blank" class="text-blue-500 hover:underline">官網查看 ↗</a>
              <button onclick="deleteItem('${item.id}')" class="text-gray-400 hover:text-red-500">刪除</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('statsBox').innerText = `總計收藏：${count} 件 | 總花費：$${totalSpend.toLocaleString()} NTD`;
    }

    fetchRate();
    loadFromCloud();
  </script>
</body>
</html>
